services:

  # Frontend
  front:
    build:
      context: ./frontend
      dockerfile: DockerFile
    ports:
      - "5173:5173" # เข้าผ่าน Browser ด้วย http://localhost:5173/
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # 🔧 vite.config.ts อ่านค่านี้จาก process.env — ถ้าไม่เปิด Hot Reload จะไม่ทำงาน
      # บน Windows/macOS ที่ใช้ bind mount เพราะ container ไม่ได้รับ event การแก้ไฟล์
      - VITE_USE_POLLING=true
    stdin_open: true # จำเป็นสำหรับ React Docker
    tty: true

  # Backend
  backend:
    container_name: php-apache
    build:
      context: ./backend
      dockerfile: DockerFile
    depends_on:
      - db
      - minio
    volumes:
      - ./backend/src:/var/www/html/
      - backend-vendor:/var/www/html/vendor
    command: >
      sh -c "composer install --no-interaction --prefer-dist --working-dir=/var/www/html
      && apache2-foreground"
    ports:
      - "8080:80"
    environment:
      - TZ=Asia/Bangkok # 🔧 บังคับให้ระบบ PHP ใช้เวลาประเทศไทย (ICT)
      # 📧 อีเมลแจ้งเตือน (ใบประกอบวิชาชีพใกล้หมดอายุ)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-tls}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-}
      - APP_URL=${APP_URL:-http://localhost:5173}
      # 📧 อีเมลคณะที่รับแจ้งเตือน "โครงการใกล้สิ้นสุด" (แจ้งแอดมินในระบบด้วย)
      - PROJECT_REMINDER_EMAIL=${PROJECT_REMINDER_EMAIL:-nus1@siam.edu}
      # Private S3-compatible object storage. Keep real secrets in the root .env.
      - STORAGE_ENDPOINT=${STORAGE_ENDPOINT:-http://minio:9000}
      - STORAGE_REGION=${STORAGE_REGION:-us-east-1}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-nurse-mis-files}
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY:-nurse-mis-local}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY:-nurse-mis-local-secret}
      - STORAGE_PATH_STYLE=${STORAGE_PATH_STYLE:-true}
      - STORAGE_LEGACY_FALLBACK=${STORAGE_LEGACY_FALLBACK:-true}

  minio:
    image: bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
    restart: always
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-nurse-mis-local}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-nurse-mis-local-secret}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/bitnami/minio/data

  # Database
  db:
    container_name: db
    image: mysql:26.7.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: MYSQL_ROOT_PASSWORD
      MYSQL_DATABASE: MYSQL_DATABASE
      MYSQL_USER: MYSQL_USER
      MYSQL_PASSWORD: MYSQL_PASSWORD
      TZ: Asia/Bangkok # 🔧 บังคับให้ Engine ของ MySQL แสตมป์ CURRENT_TIMESTAMP เป็นเวลาไทย
    ports:
      - "9906:3306"
    volumes:
      # - ./backend/nurseproject_test.sql:/docker-entrypoint-initdb.d/init.sql
      - ./mysql-data:/var/lib/mysql

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  minio-data:
  backend-vendor:
