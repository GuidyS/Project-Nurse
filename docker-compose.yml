version: '3.8'
services:

  # Frontend
  front:
    build: 
      context: ./frontend
      dockerfile: DockerFile
    ports:
      - "5173:5173"  # เข้าผ่าน Browser ด้วย http://localhost:5173
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # 🔧 vite.config.ts อ่านค่านี้จาก process.env — ถ้าไม่เปิด Hot Reload จะไม่ทำงาน
      # บน Windows/macOS ที่ใช้ bind mount เพราะ container ไม่ได้รับ event การแก้ไฟล์
      - VITE_USE_POLLING=true
    stdin_open: true # จำเป็นสำหรับ React Docker
    tty: true


  # Backend
  backend:
    container_name: php-apache
    build: 
      context: ./backend
      dockerfile: DockerFile
    depends_on:
      - db
    volumes:
      - ./backend/src:/var/www/html/
    ports:
      - 8080:80
    environment:
      - TZ=Asia/Bangkok # 🔧 เพิ่มตรงนี้: บังคับให้ระบบ PHP ใช้เวลาประเทศไทย (ICT)
      # 📧 อีเมลแจ้งเตือน (ใบประกอบวิชาชีพใกล้หมดอายุ) — ตั้งค่าในไฟล์ .env ข้าง docker-compose.yml (ดู .env.example)
      #    ถ้าไม่ตั้ง SMTP_HOST ระบบยังแจ้งเตือนในระบบได้ แต่จะไม่ส่งอีเมล
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-tls}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-}
      - APP_URL=${APP_URL:-http://localhost:5173}
      # 📧 อีเมลคณะที่รับแจ้งเตือน "โครงการใกล้สิ้นสุด" (แจ้งแอดมินในระบบด้วย)
      - PROJECT_REMINDER_EMAIL=${PROJECT_REMINDER_EMAIL:-nus1@siam.edu}

  # Database
  db:
    container_name: db
    image: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: MYSQL_ROOT_PASSWORD
      MYSQL_DATABASE: MYSQL_DATABASE
      MYSQL_USER: MYSQL_USER
      MYSQL_PASSWORD: MYSQL_PASSWORD
      TZ: Asia/Bangkok # 🔧 เพิ่มตรงนี้: บังคับให้ Engine ของ MySQL แสตมป์ CURRENT_TIMESTAMP เป็นเวลาไทย
    ports:
      - "9906:3306"
    volumes:
      #- ./backend/nurseproject_test.sql:/docker-entrypoint-initdb.d/init.sql
      - ./mysql-data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8081:80"
    restart: always
    environment:
      PMA_HOST: db
    depends_on:
      - db
      